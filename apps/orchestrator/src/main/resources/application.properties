spring.application.name=orchestrator

# GitHub Integration
# Set these via environment variables in production:
# GITHUB_OWNER, GITHUB_REPO, GITHUB_TOKEN
github.owner=${GITHUB_OWNER:mattDev0}
github.repo=${GITHUB_REPO:portfolio-monorepo}
github.token=${GITHUB_TOKEN:}

# Agent URL and timeouts
agent.url=${AGENT_URL:http://localhost:3001}
agent.connect-timeout-ms=3000
agent.read-timeout-ms=15000
# Agent Secret Key for Orchestrator -> Agent security
agent.secret-key=${AGENT_SECRET_KEY}

# Security & Authentication for Frontend -> Orchestrator
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD}
# Secret key for signing JWTs (must be at least 256 bits / 32 characters in production)
jwt.secret=${JWT_SECRET}
# JWT token duration (8 hours in milliseconds)
jwt.expiration=28800000

# Spring Boot Actuator & Prometheus configuration
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always

# Spotify analytics service
spotify.url=${SPOTIFY_URL:http://devops-spotify:3002}
spotify.service-key=${SPOTIFY_SERVICE_KEY:}

# Prometheus, queried for the VPN egress panel
prometheus.url=${PROMETHEUS_URL:http://devops-prometheus:9090}

# Portfolio uptime probes (public Cloud Run endpoints, no credentials)
portfolio.probe.enabled=${PORTFOLIO_PROBE_ENABLED:true}
portfolio.probe.interval-ms=60000
portfolio.probe.timeout-ms=10000
portfolio.targets.frontend=${PORTFOLIO_FRONTEND_URL:https://mattdev0.tech/}
portfolio.targets.rust-api=${PORTFOLIO_RUST_URL:https://portfolio-rust-api-850595626708.us-central1.run.app/health}
portfolio.targets.java-api=${PORTFOLIO_JAVA_URL:https://portfolio-java-api-850595626708.us-central1.run.app/actuator/health}

