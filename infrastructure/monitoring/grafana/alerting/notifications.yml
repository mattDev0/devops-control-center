apiVersion: 1

contactPoints:
  - orgId: 1
    name: DCC Discord
    receivers:
      - uid: dcc-discord
        type: discord
        disableResolveMessage: false
        settings:
          # Grafana expands this from its environment; the URL never enters git.
          url: $DISCORD_WEBHOOK_URL
          use_discord_username: true

policies:
  - orgId: 1
    receiver: DCC Discord
    group_by: [grafana_folder, alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
