global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Production alert evaluation and Discord delivery are provisioned in Grafana.
# Keep one evaluator so pending/firing states have a single source of truth.

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'orchestrator'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['orchestrator:8080']
